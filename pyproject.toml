[project]
name = "gizmotools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "fake-bpy-module-4-5>=20260730",
]

[tool.basedpyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"
typeCheckingMode = "standard"

reportInvalidTypeForm = "none"          # bpy.props annotations
reportIncompatibleMethodOverride = "none"  # operators' execute overrides have special return types
reportOptionalMemberAccess = "none"     # layout is always set in draw()
